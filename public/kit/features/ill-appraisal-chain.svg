<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" fill="none" role="img" aria-label="An appraisal chain that blocks rather than guesses">
<rect x=".5" y=".5" width="939" height="459" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="28" y="44" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#111827">An appraisal chain that blocks rather than guesses</text>
<text x="28" y="64" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563" opacity=".85">Resolver order in the PMS &#8212; there is deliberately no fallback</text><rect x="809" y="26" width="105" height="26" rx="13" fill="#C0201F" opacity=".12"/><text x="861" y="43" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#C0201F">no guessing</text>
<g>
  <rect x="28" y="96" width="470" height="76" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="66" cy="134" r="17" fill="#EFF6FF"/><text x="66" y="140" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1D4ED8">1</text>
  <text x="98" y="128" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#111827">employees.hod_id</text>
  <text x="98" y="148" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4B5563">Per-person override &#8212; matrix and dotted-line cases</text>
  <path d="M263 176v20" stroke="#E5E7EB" stroke-width="2"/><path d="m257 190 6 7 6-7" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="204" width="470" height="76" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="66" cy="242" r="17" fill="#EFF6FF"/><text x="66" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1D4ED8">2</text>
  <text x="98" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#111827">departments.hod_employee_id</text>
  <text x="98" y="256" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4B5563">The primary source</text>
  <path d="M263 284v20" stroke="#E5E7EB" stroke-width="2"/><path d="m257 298 6 7 6-7" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="312" width="470" height="76" rx="16" fill="#FEF2F2" stroke="#C0201F" stroke-opacity=".3"/>
  <circle cx="66" cy="350" r="17" fill="#C0201F" opacity=".14"/><text x="66" y="356" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#C0201F">3</text>
  <text x="98" y="344" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#C0201F">BLOCK</text>
  <text x="98" y="364" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#C0201F" opacity=".85">No walk up parent_dept_id. No most-senior guess. No RM L2 default.</text>
</g>
<rect x="530" y="96" width="382" height="180" rx="16" fill="#F3F4F6"/>
<text x="558" y="128" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2" fill="#2563EB">WHY NO FALLBACK</text>
<text x="558" y="158" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827">A wrong finaliser signs off an</text>
<text x="558" y="178" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827">appraisal and nobody ever notices,</text>
<text x="558" y="198" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827">because the system looks fine.</text>
<text x="558" y="228" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">So unresolvable means blocked &#8212; loudly,</text>
<text x="558" y="246" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">before the cycle opens rather than halfway</text>
<text x="558" y="264" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">through it.</text>
<rect x="530" y="292" width="382" height="96" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="558" y="322" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#111827">pms_open_period()</text>
<text x="558" y="344" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">Refuses to open while anyone is unresolvable,</text>
<text x="558" y="362" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">and reports how many. The chain is then frozen</text>
<text x="558" y="380" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">&#8212; a week-six reorg cannot change the finaliser.</text>
</svg>
