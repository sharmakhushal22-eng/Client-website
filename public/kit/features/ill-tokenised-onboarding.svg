  <text x="46" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">no account needed</text>
  <path d="M164 176h10" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/><rect x="178" y="132" width="130" height="88" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
