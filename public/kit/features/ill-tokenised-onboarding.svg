  <text x="490" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#111827">Documents</text>
  <text x="490" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">AI-verified on upload</text>
  <path d="M608 176h10" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/><rect x="622" y="132" width="130" height="88" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
