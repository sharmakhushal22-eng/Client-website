  <text x="194" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#111827">OTP verify</text>
  <text x="194" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">identity confirmed</text>
