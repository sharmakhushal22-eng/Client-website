<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" fill="none" role="img" aria-label="Theme switching, measured and tuned">
<rect x=".5" y=".5" width="759" height="349" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="28" y="44" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#111827">Theme switching, measured and tuned</text>
<text x="28" y="64" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563" opacity=".85">Not a claim &#8212; a before and after that was actually instrumented</text><rect x="622" y="26" width="112" height="26" rx="13" fill="#047857" opacity=".12"/><text x="678" y="43" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#047857">instrumented</text>
<text x="28" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="#626D80">JANKY FRAMES</text>
<rect x="28" y="126" width="322" height="34" rx="10" fill="#FEF2F2"/>
<rect x="28" y="126" width="282" height="34" rx="10" fill="#C0201F" opacity=".22"/>
<text x="44" y="148" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#C0201F">87.6%</text>
<text x="300" y="148" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C0201F" opacity=".7">before</text>
<rect x="28" y="170" width="322" height="34" rx="10" fill="#ECFDF5"/>
<rect x="28" y="170" width="26" height="34" rx="10" fill="#047857" opacity=".28"/>
<text x="66" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">3.4%</text>
<text x="334" y="192" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">after</text>

<text x="404" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="#626D80">MEDIAN FRAME TIME</text>
<rect x="404" y="126" width="322" height="34" rx="10" fill="#FEF2F2"/>
<rect x="404" y="126" width="322" height="34" rx="10" fill="#C0201F" opacity=".22"/>
<text x="420" y="148" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#C0201F">35.1 ms</text>
<rect x="404" y="170" width="322" height="34" rx="10" fill="#ECFDF5"/>
<rect x="404" y="170" width="152" height="34" rx="10" fill="#047857" opacity=".28"/>
<text x="420" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">16.6 ms</text>

<rect x="28" y="230" width="698" height="86" rx="14" fill="#F3F4F6"/>
<text x="52" y="262" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827">Blue-light filter &#183; UI scaling &#183; day/night via View Transitions API</text>
<text x="52" y="284" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">Accessibility and comfort tooling is genuinely uncommon in HR software &#8212;</text>
<text x="52" y="302" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563">and it is the easiest thing on this page to demo live.</text>
