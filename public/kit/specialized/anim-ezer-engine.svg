<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none" role="img" aria-label="Every location type feeds one engine, one register output">
<style>
  .flow{stroke-dasharray:9 13;animation:dash 1.5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-44}}
  .ring{transform-origin:460px 250px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{transform-origin:460px 250px;animation:beat 2.8s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .loc,.head{animation:lift 2.8s ease-in-out infinite}
  @keyframes lift{0%,100%{opacity:.62}22%{opacity:1}}
  .tick{stroke-dasharray:20;stroke-dashoffset:20;animation:draw 2.8s ease-out infinite}
  @keyframes draw{0%{stroke-dashoffset:20}18%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
  .reg{animation:slide 2.8s ease-in-out infinite}
  @keyframes slide{0%,100%{opacity:.55;transform:translateY(8px)}45%,80%{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.loc,.head{opacity:1}.tick{stroke-dashoffset:0}.reg{opacity:1;transform:none}}
</style>
<defs>
