<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" fill="none" role="img" aria-label="Punch in from the employee portal">
<style>
  .rip{transform-origin:180px 168px;animation:rip 3s ease-out infinite;opacity:0}
  .rip2{animation-delay:.5s}
  @keyframes rip{0%{transform:scale(.75);opacity:.5}70%,100%{transform:scale(1.5);opacity:0}}
  .idle{animation:idle 6s steps(1) infinite}
  @keyframes idle{0%,49%{opacity:1}50%,100%{opacity:0}}
  .done{animation:done 6s steps(1) infinite}
  @keyframes done{0%,49%{opacity:0}50%,100%{opacity:1}}
  .press{transform-origin:180px 168px;animation:press 6s ease-in-out infinite}
  @keyframes press{0%,46%,54%,100%{transform:scale(1)}50%{transform:scale(.94)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<defs><linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs>
<rect x=".5" y=".5" width="359" height="299" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="28" y="42" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.3" fill="#626D80">ATTENDANCE</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#111827">Shift 09:30 - 18:30</text>
<circle class="rip" cx="180" cy="168" r="62" fill="#2563EB" opacity=".25"/>
<circle class="rip rip2" cx="180" cy="168" r="62" fill="#2563EB" opacity=".25"/>
<g class="press">
  <circle cx="180" cy="168" r="62" fill="url(#pb)"/>
  <g class="idle">
    <path d="M180 146v22l14 9" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g class="done" opacity="0">
    <path d="m164 168 11 11 22-24" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</g>
<g class="idle"><text x="180" y="262" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#1D4ED8">Tap to punch in</text></g>
<g class="done" opacity="0"><text x="180" y="262" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">Punched in &#183; 09:24 AM</text></g>
</svg>
