<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" fill="none" role="img" aria-label="Eight step payroll run">
<style>
  .bar{stroke-dasharray:596;stroke-dashoffset:596;animation:fill 5s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes fill{0%{stroke-dashoffset:596}80%,100%{stroke-dashoffset:0}}
  .node{animation:on 5s linear infinite}
  @keyframes on{0%,8%{fill:#FFFFFF;stroke:#E5E7EB}12%,100%{fill:#2563EB;stroke:#2563EB}}
  .chk{stroke-dasharray:20;stroke-dashoffset:20;animation:tick 5s linear infinite}
  @keyframes tick{0%,8%{stroke-dashoffset:20}14%,100%{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.bar{stroke-dashoffset:0}.node{fill:#2563EB;stroke:#2563EB}.chk{stroke-dashoffset:0}}
</style>
