<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none" role="img" aria-label="Field staff logging a journey the server will re-measure">
<style>
.trail{stroke-dasharray:400;stroke-dashoffset:400;animation:t 5s ease-in-out infinite}
@keyframes t{0%{stroke-dashoffset:400}45%,100%{stroke-dashoffset:0}}
.mini{stroke-dasharray:70;stroke-dashoffset:70;animation:m 5s ease-in-out infinite}
@keyframes m{0%{stroke-dashoffset:70}40%,100%{stroke-dashoffset:0}}
.pin{animation:p 5s ease-out infinite;transform-origin:562px 138px}
@keyframes p{0%,44%{opacity:0;transform:scale(.5)}54%,100%{opacity:1;transform:none}}
.chip{animation:c 5s ease-out infinite}
@keyframes c{0%,58%{opacity:0;transform:translateY(8px)}68%,100%{opacity:1;transform:none}}
.warnchip{animation:c2 5s ease-out infinite}
@keyframes c2{0%,20%{opacity:0}28%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.trail,.mini{stroke-dashoffset:0}.pin,.chip,.warnchip{opacity:1;transform:none}}</style>
<rect width="600" height="440" rx="24" fill="#F3F5F8"/>

<ellipse cx="234" cy="352" rx="66" ry="11" fill="#2563EB" opacity=".10"/>
<path class="road" d="M392 366C440 300 392 258 434 210s102-28 128-72" stroke="#626D80" stroke-width="26" stroke-linecap="round" opacity=".14" fill="none"/>
<path d="M392 366C440 300 392 258 434 210s102-28 128-72" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity=".16" fill="none"/>
<path class="trail" d="M392 366C440 300 392 258 434 210s102-28 128-72" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="392" cy="366" r="8" fill="#2563EB"/>
<circle class="pin" cx="562" cy="138" r="9" fill="#047857"/>
<g transform="translate(188 150) scale(0.94)">
  <path d="M40 142v72" stroke="#475569" stroke-width="17" stroke-linecap="round"/><path d="M62 142v72" stroke="#475569" stroke-width="17" stroke-linecap="round"/>
  <path d="M30 78q20-10 40 0l6 66q-26 9-52 0z" fill="#2563EB"/>
  <path d="M28 84q-14 26-6 48" stroke="#2563EB" stroke-width="15" stroke-linecap="round" fill="none"/>
  <circle cx="21" cy="134" r="8" fill="#8A5533"/>
  <path d="M72 88q26 10 28 34" stroke="#2563EB" stroke-width="15" stroke-linecap="round" fill="none"/><circle cx="100" cy="124" r="8" fill="#8A5533"/>
  <rect x="43" y="52" width="14" height="18" rx="6" fill="#8A5533"/>
  <circle cx="50" cy="36" r="22" fill="#8A5533"/>
  <path d="M26 36a24 24 0 0 1 48 0q-6-8-14-6t-20 2-14 4z" fill="#1F1A16"/>
</g>
<g transform="translate(268 246) rotate(-8)">
  <rect width="54" height="92" rx="10" fill="#111827"/>
  <rect x="4" y="4" width="46" height="84" rx="7" fill="#FFFFFF"/>
  <path class="mini" d="M14 78c8-14 4-24 12-34s18-6 22-18" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <rect x="10" y="12" width="24" height="5" rx="2.5" fill="#111827" opacity=".18"/>
</g>
<g class="chip">
  <rect x="330" y="88" width="180" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="350" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#626D80">SERVER RE-MEASURED</text>
  <text x="350" y="136" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#1D4ED8">21.2 km &#183; &#8377;254.40</text>
</g>
<g class="warnchip">
  <rect x="40" y="88" width="150" height="52" rx="13" fill="#FFFBEB"/>
  <text x="58" y="110" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#B45309">CLIENT SAYS</text>
  <text x="58" y="130" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#B45309">18.4 km</text>
</g>
</svg>
