<style>.arc{animation:sw 3s cubic-bezier(.3,.9,.3,1) infinite}@keyframes sw{0%{stroke-dashoffset:553}60%,100%{stroke-dashoffset:2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.arc{stroke-dashoffset:2}}</style>
<rect x=".5" y=".5" width="419" height="379" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="28" y="44" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#111827">Payroll accuracy</text>
<text x="28" y="64" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#4B5563" opacity=".85">Placeholder data</text>

<circle cx="210" cy="230" r="88" stroke="#F3F4F6" stroke-width="34" fill="none"/>
<circle class="arc" cx="210" cy="230" r="88" stroke="#2563EB" stroke-width="34" fill="none" stroke-linecap="round"
        stroke-dasharray="553" stroke-dashoffset="553" transform="rotate(-90 210 230)"/>
<text x="210" y="240" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#111827">99.6%</text>
