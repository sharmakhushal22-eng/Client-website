<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" fill="none" role="img" aria-label="Shop-floor employee punching in">
<style>
.rip{transform-origin:427px 170px;animation:r 4s ease-out infinite}
