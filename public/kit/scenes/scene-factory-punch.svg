.ic1{animation:f1 4s steps(1) infinite}@keyframes f1{0%,44%{opacity:1}45%,100%{opacity:0}}
.ic2{animation:f2 4s steps(1) infinite}@keyframes f2{0%,44%{opacity:0}45%,100%{opacity:1}}
.t1{animation:f1 4s steps(1) infinite}
.t2{animation:f2 4s steps(1) infinite}
