    <linearGradient id="nb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <filter id="s3" x="-8%" y="-8%" width="120%" height="126%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1D4ED8" flood-opacity=".16"/></filter>
